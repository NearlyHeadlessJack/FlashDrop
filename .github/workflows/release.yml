name: Release

# 推送 v* 标签时触发：三个平台各打一个单文件可执行程序，然后建 release 并把
# 产物挂到 assets 上。
#
# 支持手动重跑（Actions 页面 Run workflow，填一个已存在的标签），用于调试
# 流水线而不必每次递增版本号。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布或重跑的标签（必须已存在，如 v0.2.2）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: flashdrop-windows-amd64.exe
            binary: dist/flashdrop.exe
            arch: amd64
          # macos-15 是 arm64（Apple 芯片）
          - os: macos-15
            asset: flashdrop-macos-arm64
            binary: dist/flashdrop
            arch: arm64
          # GitHub 现在仅剩的 Intel 镜像；若账号里不可用，可退回 macos-13
          - os: macos-15-intel
            asset: flashdrop-macos-x86_64
            binary: dist/flashdrop
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        shell: python
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          from flashdrop import __version__

          tag = os.environ["TAG"]
          if tag != f"v{__version__}":
              print(f"::error::tag {tag} does not match v{__version__} in flashdrop/__init__.py")
              sys.exit(1)
          print(f"tag {tag} matches package version {__version__}")

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build single-file executable
        run: python -m PyInstaller --clean --noconfirm packaging/flashdrop.spec

      - name: Verify architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          file "${{ matrix.binary }}"
          archs="$(lipo -archs "${{ matrix.binary }}")"
          echo "lipo: $archs"
          test "$archs" = "${{ matrix.arch }}"

      # 用一个随机端口启动，再从日志里读出实际 URL：避免 8765 被占用导致
      # 客户端连错端口，也避免进程早早退出时只是干等超时。
      - name: Smoke test (start server, probe WebUI)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -uo pipefail
          BIN="${{ matrix.binary }}"

          "$BIN" --version || { echo "::error::--version 执行失败"; exit 1; }

          rm -f server.log
          "$BIN" --no-browser --port 0 > server.log 2>&1 &
          pid=$!

          ready=0
          url=""
          for i in $(seq 1 120); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::FlashDrop 进程在第 ${i} 秒就退出了，没等到 WebUI 就绪"
              break
            fi
            url="$(grep -oE 'http://127\.0\.0\.1:[0-9]+/' server.log 2>/dev/null | head -n 1 || true)"
            if [ -n "$url" ] && python -c "import sys,urllib.request; urllib.request.urlopen(sys.argv[1] + 'api/health', timeout=3).read()" "$url" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::WebUI 在 120 秒内没有就绪"
            echo "---- server.log ----"
            cat server.log 2>/dev/null || true
            echo "---- listening ports ----"
            (netstat -ano 2>/dev/null || true) | grep -i listen | head -n 20 || true
            echo "---- processes ----"
            (ps -ef 2>/dev/null || true) | grep -i flashdrop | grep -v grep | head -n 5 || true
            kill "$pid" 2>/dev/null || true
            exit 1
          fi

          echo "WebUI ready at ${url}"
          python -c "import sys,urllib.request; print(urllib.request.urlopen(sys.argv[1], timeout=5).read(160).decode('utf-8','replace'))" "$url"
          kill "$pid" 2>/dev/null || true

      - name: Package asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp "${{ matrix.binary }}" "release/${{ matrix.asset }}"
          ls -lh "release/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List assets
        run: ls -lh release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 重跑时覆盖已有 release 的产物，而不是整条流水线失败
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "FlashDrop ${TAG}" \
              --generate-notes \
              --verify-tag
          fi
